name: pack-review
# Reviews a PR against the repo's context packs. Call it from a workflow on pull_request, as docs/reference.md shows.
# The caller grants contents: read and pull-requests: write, and each job here narrows that: only post can write.
on:
  workflow_call:
    inputs:
      model:
        description: The model the agents use, if not Claude Code's default.
        type: string
        required: false
        default: ''
    secrets:
      claude_code_oauth_token:
        description: A Claude Code OAuth token, from `claude setup-token`. Pass this or anthropic_api_key.
        required: false
      anthropic_api_key:
        description: An Anthropic API key. Pass this or claude_code_oauth_token.
        required: false
# One reviewing run per PR. A run that will review cancels the one before it, and reviews the PR as it is when its
# pr job starts, so whichever run is left reviews the newest head. A run that won't review, such as one for a title
# edit, gets a group of its own: GitHub cancels a run waiting in a group when another joins, and a review waits there
# while the run before it is cancelled. Its condition is the pr job's, written twice since concurrency can't read a
# job's if.
concurrency:
  group: >-
    ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    && (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
    && format('pack-review-{0}', github.event.pull_request.number) || format('pack-review-skip-{0}', github.run_id) }}
  cancel-in-progress: true
# Every job checks out this repo at the commit the caller pinned, job.workflow_sha, into .pack-review, and runs its
# actions from there, so the actions and this workflow always match. The PR's own checkout comes first where a job
# needs one, since checking it out cleans the workspace.
jobs:
  pr:
    # Drafts wait until they're ready. PRs from forks get no secrets, so they're skipped. An edit reviews again only
    # when it changed the base branch, so the findings match the new diff. The concurrency group at the top repeats this
    # condition: change both together.
    if: >-
      ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'edited' || github.event.changes.base.ref.from != null) }}
    runs-on: ubuntu-latest
    # pull-requests read is for the PR's head and base now. This job runs no agent, so the review's agent never gets
    # a token that reads the PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      base-ref: ${{ steps.pr.outputs.base-ref }}
    steps:
      # The PR as it is now, not as the event that started this run saw it, so a run left after the ones a newer push
      # cancelled reviews that push too. Every later job reviews these commits.
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR"
          --jq '"head=\(.head.sha)\nbase=\(.base.sha)\nbase-ref=\(.base.ref)"' >> "$GITHUB_OUTPUT"
  review:
    needs: pr
    runs-on: ubuntu-latest
    # The review's agent runs the pack-findings skill, as a local review does. It reads the repo and nothing else, so
    # GitHub, not its tool list, keeps it from writing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pr.outputs.head }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pack-review
          persist-credentials: false
      - uses: ./.pack-review/review/review
        with:
          head: ${{ needs.pr.outputs.head }}
          base: ${{ needs.pr.outputs.base }}
          base-ref: ${{ needs.pr.outputs.base-ref }}
          model: ${{ inputs.model }}
          claude-code-oauth-token: ${{ secrets.claude_code_oauth_token }}
          anthropic-api-key: ${{ secrets.anthropic_api_key }}
  pairing:
    needs: [pr, review]
    runs-on: ubuntu-latest
    # The pairing job's agents read pack-review's threads and can't write.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The agents here read no files, but claude-code-action restores .claude and the instruction files from the base
      # branch with git, which fails outside a checkout.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pr.outputs.head }}
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pack-review
          persist-credentials: false
      - uses: ./.pack-review/review/pairing
        with:
          model: ${{ inputs.model }}
          claude-code-oauth-token: ${{ secrets.claude_code_oauth_token }}
          anthropic-api-key: ${{ secrets.anthropic_api_key }}
  post:
    needs: [review, pairing]
    runs-on: ubuntu-latest
    # Two posts at once could each find no summary and add one, so they wait their turn.
    concurrency:
      group: pack-review-post-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pack-review
          persist-credentials: false
      - uses: ./.pack-review/review/post
