name: context-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
jobs:
  review:
    uses: mjewell/context-review/.github/workflows/review.yml@a1cbc8d84ab7013d7449c54b251a60d1ac2ee3e0
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
