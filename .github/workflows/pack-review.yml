name: pack-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
jobs:
  review:
    # Drafts wait until they're ready. PRs from forks get no secrets, so they're skipped.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: pack-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The action from this checkout, unlike the reference's @main, so a PR that changes it reviews with its change.
      - uses: ./review
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
