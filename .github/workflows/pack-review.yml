name: pack-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
jobs:
  review:
    concurrency:
      group: pack-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    # The workflow from this commit, unlike the reference's pinned one, so a PR that changes it reviews with its change.
    uses: ./.github/workflows/review.yml
    secrets:
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
