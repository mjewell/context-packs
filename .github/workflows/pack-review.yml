name: pack-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
jobs:
  review:
    # This repo's reusable workflow from the PR's own commit, unlike the reference's pinned one, so a PR that changes
    # the review is reviewed with its change.
    uses: ./.github/workflows/review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
