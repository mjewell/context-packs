name: pack-review
description: Review a PR against the repo's context packs with claude-code-action, comment on what it finds, and keep a summary for the author to go through locally.
inputs:
  anthropic-api-key:
    description: An Anthropic API key for the review agent. Pass this or claude-code-oauth-token.
    required: false
    default: ''
  claude-code-oauth-token:
    description: A Claude Code OAuth token, from `claude setup-token`, so the review uses a Pro or Max subscription. Pass this or anthropic-api-key.
    required: false
    default: ''
  model:
    description: The model to review with, if not Claude Code's default.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the checkout
      shell: bash
      env:
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$HEAD" ]; then
          echo "::error::The PR's head, $HEAD, isn't checked out. Check out with ref: \${{ github.event.pull_request.head.sha }}."
          exit 1
        fi
    - name: Prepare the review
      id: prepare
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        MODEL: ${{ inputs.model }}
      # The agent has no shell, so it reads the diff and log from files. A new folder outside the checkout, so no path
      # the PR controls, such as a symlink, decides where they're written.
      run: |
        inputs=$(mktemp -d "$RUNNER_TEMP/pack-review.XXXXXX")
        git diff --no-ext-diff --no-textconv "$BASE...$HEAD" > "$inputs/diff.patch"
        git log --no-decorate "$BASE..$HEAD" > "$inputs/log.txt"
        echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
        echo "claude-args=$(python3 "$GITHUB_ACTION_PATH/args.py" --pr "$PR" --head "$HEAD" --inputs "$inputs" --model "$MODEL")" >> "$GITHUB_OUTPUT"
    - name: Review
      id: review
      # v1.0.268, pinned by commit since a tag can move.
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
      with:
        # claude-code-action stops with an error when neither is set.
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ github.token }}
        prompt: /context-packs:pack-review ci ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} ${{ steps.prepare.outputs.inputs }}
        claude_args: ${{ steps.prepare.outputs.claude-args }}
    - name: Show what the agent did
      if: always() && steps.review.outputs.execution_file != ''
      shell: bash
      env:
        TRANSCRIPT: ${{ steps.review.outputs.execution_file }}
      run: python3 "$GITHUB_ACTION_PATH/transcript.py" --file "$TRANSCRIPT"
    - name: Post the summary
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FINDINGS: ${{ steps.review.outputs.structured_output }}
        PR: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        printf '%s' "$FINDINGS" > "$RUNNER_TEMP/pack-review-findings.json"
        python3 "$GITHUB_ACTION_PATH/summary.py" --pr "$PR" --base "$BASE" --head "$HEAD" \
          --findings "$RUNNER_TEMP/pack-review-findings.json"
