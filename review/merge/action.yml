name: pack-review merge
description: Group the finders' findings with claude-code-action, build the review's findings from the groups, and save them as the artifact pack-review-report, for the threads and post actions. Run it in a job with only contents read, after every finder.
inputs:
  head:
    description: The PR's head commit to review, from the units job.
    required: true
  base:
    description: The PR's base commit, from the units job.
    required: true
  base-ref:
    description: The branch the PR merges into, from the units job.
    required: true
  anthropic-api-key:
    description: An Anthropic API key for the merging agent. Pass this or claude-code-oauth-token.
    required: false
    default: ''
  claude-code-oauth-token:
    description: A Claude Code OAuth token, from `claude setup-token`, so the review uses a Pro or Max subscription. Pass this or anthropic-api-key.
    required: false
    default: ''
  model:
    description: The model to merge with, if not Claude Code's default.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the checkout
      shell: bash
      env:
        HEAD: ${{ inputs.head }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$HEAD" ]; then
          echo "::error::The PR's head, $HEAD, isn't checked out. Check out the head the units job read."
          exit 1
        fi
    - name: Make the agent's folder
      id: folder
      shell: bash
      # A new folder outside the checkout, so no path the PR controls, such as a symlink, decides where files go.
      run: echo "inputs=$(mktemp -d "$RUNNER_TEMP/pack-review.XXXXXX")" >> "$GITHUB_OUTPUT"
    - name: Get the finders' answers
      # v8.0.2, pinned by commit since a tag can move.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: pack-review-unit-*
        merge-multiple: true
        path: ${{ steps.folder.outputs.inputs }}
    - name: Prepare the merge
      id: prepare
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        INPUTS: ${{ steps.folder.outputs.inputs }}
      # The folder holds each finder's unit-<n>.json for the agent. The lines each diff shows go outside the agent's
      # folder, for the report to pick where each new thread opens.
      run: |
        python3 "$GITHUB_ACTION_PATH/../git_server.py" --base "$BASE" --head "$HEAD" shown > "$RUNNER_TEMP/pack-review-shown.json"
        python3 "$GITHUB_ACTION_PATH/../units.py" merge --inputs "$INPUTS" --base "$BASE" --head "$HEAD" --model "$MODEL"
    - name: Merge
      id: review
      # v1.0.268, pinned by commit since a tag can move.
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ github.token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.claude-args }}
    - name: Show what the agent did
      if: always() && steps.review.outputs.execution_file != ''
      shell: bash
      env:
        TRANSCRIPT: ${{ steps.review.outputs.execution_file }}
      run: python3 "$GITHUB_ACTION_PATH/../transcript.py" --file "$TRANSCRIPT"
    - name: Write the report
      shell: bash
      env:
        GROUPS: ${{ steps.review.outputs.structured_output }}
        INPUTS: ${{ steps.folder.outputs.inputs }}
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD: ${{ inputs.head }}
      run: |
        printf '%s' "$GROUPS" > "$RUNNER_TEMP/pack-review-groups.json"
        mkdir "$RUNNER_TEMP/pack-review-report"
        python3 "$GITHUB_ACTION_PATH/../report.py" --base "$BASE" --base-ref "$BASE_REF" --head "$HEAD" \
          --sources "$INPUTS/sources.json" --groups "$RUNNER_TEMP/pack-review-groups.json" --shown "$RUNNER_TEMP/pack-review-shown.json" \
          --out "$RUNNER_TEMP/pack-review-report/report.json"
    - name: Save the report
      # v7.0.2, pinned by commit since a tag can move.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pack-review-report
        path: ${{ runner.temp }}/pack-review-report/report.json
        if-no-files-found: error
        retention-days: 1
