name: pack-review find
description: Check a PR against one unit of the repo's context packs with claude-code-action, and save the finder's answer as the artifact pack-review-unit-<unit>, for the merge action. Run it in a job with only contents read, once per unit the units action lists.
inputs:
  head:
    description: The PR's head commit to review, from the units job.
    required: true
  base:
    description: The PR's base commit, from the units job.
    required: true
  unit:
    description: The unit's number, from the units action.
    required: true
  anthropic-api-key:
    description: An Anthropic API key for the finder. Pass this or claude-code-oauth-token.
    required: false
    default: ''
  claude-code-oauth-token:
    description: A Claude Code OAuth token, from `claude setup-token`, so the review uses a Pro or Max subscription. Pass this or anthropic-api-key.
    required: false
    default: ''
  model:
    description: The model to check with, if not Claude Code's default.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the checkout
      shell: bash
      env:
        HEAD: ${{ inputs.head }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$HEAD" ]; then
          echo "::error::The PR's head, $HEAD, isn't checked out. Check out the head the units job read."
          exit 1
        fi
    - name: Prepare the finder
      id: prepare
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
        UNIT: ${{ inputs.unit }}
      # The finder's prompt holds its unit's docs, and it reads the change through the git server. docs.txt goes in a
      # new folder outside the checkout, so no path the PR controls, such as a symlink, decides where it's written.
      run: |
        inputs=$(mktemp -d "$RUNNER_TEMP/pack-review.XXXXXX")
        echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
        python3 "$GITHUB_ACTION_PATH/../../src/cli.py" docs > "$inputs/docs.txt"
        python3 "$GITHUB_ACTION_PATH/../units.py" prompt --docs "$inputs/docs.txt" --unit "$UNIT" --base "$BASE" \
          --head "$HEAD" --model "$MODEL"
    - name: Check the unit
      id: review
      # v1.0.268, pinned by commit since a tag can move.
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
      with:
        # claude-code-action stops with an error when neither is set.
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ github.token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.claude-args }}
    - name: Show what the finder did
      if: always() && steps.review.outputs.execution_file != ''
      shell: bash
      env:
        TRANSCRIPT: ${{ steps.review.outputs.execution_file }}
      run: python3 "$GITHUB_ACTION_PATH/../transcript.py" --file "$TRANSCRIPT"
    - name: Write the answer
      shell: bash
      env:
        FINDINGS: ${{ steps.review.outputs.structured_output }}
        UNIT: ${{ inputs.unit }}
      # claude-code-action checks the answer against the output schema, so the one way it can be wrong is missing.
      run: |
        if [ -z "$FINDINGS" ]; then
          echo "::error::Unit $UNIT's finder returned no answer."
          exit 1
        fi
        mkdir "$RUNNER_TEMP/pack-review-unit"
        printf '%s' "$FINDINGS" > "$RUNNER_TEMP/pack-review-unit/unit-$UNIT.json"
    - name: Save the answer
      # v7.0.2, pinned by commit since a tag can move.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pack-review-unit-${{ inputs.unit }}
        path: ${{ runner.temp }}/pack-review-unit/unit-${{ inputs.unit }}.json
        if-no-files-found: error
        retention-days: 1
