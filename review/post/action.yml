name: pack-review post
description: Post pack-review's review threads and its summary comment on a PR, from the report the find action and the pairs the threads action saved in earlier jobs of the same run. It runs no agent. Run it in a job with pull-requests write.
runs:
  using: composite
  steps:
    - name: Get the report
      # v8.0.2, pinned by commit since a tag can move.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: pack-review-report
        path: ${{ runner.temp }}/pack-review-report
    - name: Get the pairs
      # v8.0.2, pinned by commit since a tag can move.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: pack-review-threads
        path: ${{ runner.temp }}/pack-review-threads
    - name: Post the threads
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ runner.temp }}/pack-review-report/report.json
        PAIRED: ${{ runner.temp }}/pack-review-threads/paired.json
      run: python3 "$GITHUB_ACTION_PATH/../post.py" --pr "$PR" --report "$REPORT" --paired "$PAIRED"
    - name: Post the summary
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ runner.temp }}/pack-review-report/report.json
        PAIRED: ${{ runner.temp }}/pack-review-threads/paired.json
      run: python3 "$GITHUB_ACTION_PATH/../summary.py" --pr "$PR" --report "$REPORT" --paired "$PAIRED"
