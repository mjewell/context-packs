name: pack-review units
description: List the review's finders, one for the instruction file, one for each pack's docs and then the uncovered finder, as the output units, a JSON list of their numbers for a matrix that starts each. Run it in a job with only contents read.
outputs:
  units:
    description: The units' numbers, as a JSON list.
    value: ${{ steps.list.outputs.units }}
runs:
  using: composite
  steps:
    - name: List the units
      id: list
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../../src/cli.py" docs > "$RUNNER_TEMP/pack-review-docs.txt"
        python3 "$GITHUB_ACTION_PATH/../units.py" list --docs "$RUNNER_TEMP/pack-review-docs.txt"
