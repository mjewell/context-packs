name: pack-review review
description: Review a PR against the repo's context packs. claude-code-action runs the pack-findings skill on the PR's range, as a local review does, and a script turns the findings the skill's wizard built into the artifact pack-review-report, for the pairing and post actions. Run it in a job with only contents read.
inputs:
  head:
    description: The PR's head commit to review, from the pr job.
    required: true
  base:
    description: The PR's base commit, from the pr job.
    required: true
  base-ref:
    description: The branch the PR merges into, from the pr job.
    required: true
  anthropic-api-key:
    description: An Anthropic API key for the review. Pass this or claude-code-oauth-token.
    required: false
    default: ''
  claude-code-oauth-token:
    description: A Claude Code OAuth token, from `claude setup-token`, so the review uses a Pro or Max subscription. Pass this or anthropic-api-key.
    required: false
    default: ''
  model:
    description: The model to review with, if not Claude Code's default.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check the checkout
      shell: bash
      env:
        HEAD: ${{ inputs.head }}
      run: |
        if [ "$(git rev-parse HEAD)" != "$HEAD" ]; then
          echo "::error::The PR's head, $HEAD, isn't checked out. Check out the head the pr job read."
          exit 1
        fi
    - name: Prepare the review
      id: prepare
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        MODEL: ${{ inputs.model }}
      # The wizard keeps its runs in TMPDIR/pack-review-runs and has agents write answers in
      # TMPDIR/pack-review-answers. So the review gets a new folder outside the checkout as its TMPDIR, and the agent
      # may write only in pack-review-answers, which has to exist before it starts. The report reads the findings from
      # pack-review-runs. No path the PR controls decides where either is.
      run: |
        temp=$(mktemp -d "$RUNNER_TEMP/pack-review-temp.XXXXXX")
        mkdir "$temp/pack-review-runs" "$temp/pack-review-answers"
        echo "temp=$temp" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/../start.ts" --base "$BASE" --head "$HEAD" --answers "$temp/pack-review-answers" \
          --model "$MODEL"
    - name: Review
      id: review
      # v1.0.268, pinned by commit since a tag can move.
      uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
      env:
        TMPDIR: ${{ steps.prepare.outputs.temp }}
        # The session ends when the orchestrator's turn does, and a finder in the background ends with it. This takes
        # run_in_background out of the Agent tool, so every subagent runs in the foreground.
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
      with:
        # claude-code-action stops with an error when neither is set.
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ github.token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: ${{ steps.prepare.outputs.claude-args }}
    - name: Show what the agent did
      if: always() && steps.review.outputs.execution_file != ''
      shell: bash
      env:
        TRANSCRIPT: ${{ steps.review.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/../transcript.ts" --file "$TRANSCRIPT"
    - name: Write the report
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD: ${{ inputs.head }}
        RUNS: ${{ steps.prepare.outputs.temp }}/pack-review-runs
      # One run of the wizard reached its findings. Any other count means the review didn't finish, or ran twice.
      run: |
        found=$(find "$RUNS" -mindepth 2 -maxdepth 2 -name findings.json)
        count=$(printf '%s' "$found" | grep -c . || true)
        if [ "$count" != 1 ]; then
          echo "::error::The review left findings from $count runs of the wizard in $RUNS, not 1, so it didn't finish or ran twice. Its log above shows how far it got."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/../change.ts" --base "$BASE" --head "$HEAD" shown > "$RUNNER_TEMP/pack-review-shown.json"
        mkdir "$RUNNER_TEMP/pack-review-report"
        node "$GITHUB_ACTION_PATH/../report.ts" --base "$BASE" --base-ref "$BASE_REF" --head "$HEAD" \
          --findings "$found" --shown "$RUNNER_TEMP/pack-review-shown.json" \
          --out "$RUNNER_TEMP/pack-review-report/report.json"
    - name: Save the report
      # v7.0.2, pinned by commit since a tag can move.
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pack-review-report
        path: ${{ runner.temp }}/pack-review-report/report.json
        if-no-files-found: error
        retention-days: 1
